name: Деплой превью на GitHub Pages

on:
  push:
    branches:
      - main
      - claude/new-chat-repo-belqxp
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # GitHub Pages отдаёт только статику — серверный /api/order (шлёт
      # заявки в Telegram) на статическом экспорте собраться не может.
      # Убираем его только из этой сборки превью; в репозитории он остаётся
      # нетронутым для боевого хостинга (Beget с Node.js).
      - name: Remove server-only API route for static export
        run: rm -rf app/api

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_PREVIEW: "true"
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
